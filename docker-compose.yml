version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: escala_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escala_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - escala_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: escala_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/escala_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - escala_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escala_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - escala_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  escala_network:
    driver: bridge

